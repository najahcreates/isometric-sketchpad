<!DOCTYPE html>
<html lang="en" class="bg-zinc-900 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric Sketchpad | NajahCreates</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden">
  <div id="controls" class="absolute top-4 left-4 z-10 bg-zinc-800/80 text-white px-4 py-3 rounded-xl shadow-lg flex flex-wrap gap-2 items-center max-w-full">
    <input id="filename" value="sketchpad" placeholder="filename" class="px-3 py-1 text-sm bg-zinc-700 text-white border-none rounded-md outline-none w-[120px]" />
    <button onclick="saveLines()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3 py-1 rounded">💾 Save</button>
    <button onclick="undo()" class="bg-zinc-700 hover:bg-zinc-600 text-white text-sm px-3 py-1 rounded">↩️ Undo</button>
    <button onclick="redo()" class="bg-zinc-700 hover:bg-zinc-600 text-white text-sm px-3 py-1 rounded">🔁 Redo</button>
    <input id="fileLoader" type="file" accept=".isk" class="text-sm text-white bg-zinc-700 rounded cursor-pointer file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-sm file:bg-zinc-600"/>
  </div>

  <canvas id="canvas" class="block w-full h-full"></canvas>

  <!-- Made with ❤️ NajahCreates -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 text-zinc-400 text-sm bg-zinc-800/80 px-4 py-2 rounded-xl shadow-lg flex items-center">
    Made with <span class="mx-1 text-red-500">❤️</span> NajahCreates
  </div>

  <script>
    const dx = 40;
    const dy = dx / 2;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let offsetX = canvas.width / 2;
    let offsetY = canvas.height / 2;
    let dragging = false;
    let dragStart = { x: 0, y: 0 };
    let lines = [];
    let undoneLines = [];
    let selectedPoint = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      offsetX = canvas.width / 2;
      offsetY = canvas.height / 2;
      drawGrid();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function isoToScreen(x, y) {
      return {
        x: (x - y) * dx + offsetX,
        y: (x + y) * dy + offsetY
      };
    }

    function screenToIso(sx, sy) {
      sx -= offsetX;
      sy -= offsetY;
      let x = (sx / dx + sy / dy) / 2;
      let y = (sy / dy - sx / dx) / 2;
      return { x: Math.round(x), y: Math.round(y) };
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1;

      const range = 60;
      for (let i = -range; i < range; i++) {
        for (let j = -range; j < range; j++) {
          const { x, y } = isoToScreen(i, j);
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fillStyle = "#666";
          ctx.fill();
        }
      }

      // Highlight selected point
      if (selectedPoint) {
        const pt = isoToScreen(selectedPoint.x, selectedPoint.y);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#facc15"; // yellow-400
        ctx.fill();
      }

      // Draw lines
      ctx.strokeStyle = "#22d3ee"; // cyan-400
      ctx.lineWidth = 2;
      lines.forEach(([p1, p2]) => {
        const s1 = isoToScreen(p1.x, p1.y);
        const s2 = isoToScreen(p2.x, p2.y);
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        ctx.stroke();
      });
    }

    function getEventPosition(e) {
      // Support both touch and mouse events
      if (e.touches && e.touches.length > 0) {
        return {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      } else {
        return {
          x: e.clientX,
          y: e.clientY
        };
      }
    }

    canvas.addEventListener("mousedown", (e) => {
      dragging = true;
      dragStart = getEventPosition(e);
    });

    canvas.addEventListener("mousemove", (e) => {
      if (dragging) {
        const pos = getEventPosition(e);
        offsetX += pos.x - dragStart.x;
        offsetY += pos.y - dragStart.y;
        dragStart = pos;
        drawGrid();
      }
    });

    canvas.addEventListener("mouseup", () => dragging = false);
    canvas.addEventListener("mouseleave", () => dragging = false);

    // Touch events for panning (dragging)
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        dragging = true;
        dragStart = getEventPosition(e);
      }
    });
    canvas.addEventListener("touchmove", (e) => {
      if (dragging && e.touches.length === 1) {
        const pos = getEventPosition(e);
        offsetX += pos.x - dragStart.x;
        offsetY += pos.y - dragStart.y;
        dragStart = pos;
        drawGrid();
        e.preventDefault();
      }
    }, { passive: false });
    canvas.addEventListener("touchend", () => dragging = false);
    canvas.addEventListener("touchcancel", () => dragging = false);

    // Helper to find closest grid point to user's click/touch
    function closestGridPoint(screenX, screenY) {
      const iso = screenToIso(screenX, screenY);
      // Snap to nearest grid point
      return { x: iso.x, y: iso.y };
    }

    canvas.addEventListener("click", (e) => {
      if (dragging) return;
      const pt = closestGridPoint(e.clientX, e.clientY);

      if (!selectedPoint) {
        selectedPoint = pt;
      } else {
        lines.push([selectedPoint, pt]);
        selectedPoint = null;
        undoneLines = [];
      }
      drawGrid();
    });

    // Touch event for tap to create/select points
    canvas.addEventListener("touchend", (e) => {
      // Only single taps, not dragging
      if (dragging) return;
      if (e.changedTouches.length === 1) {
        const touch = e.changedTouches[0];
        const pt = closestGridPoint(touch.clientX, touch.clientY);

        if (!selectedPoint) {
          selectedPoint = pt;
        } else {
          lines.push([selectedPoint, pt]);
          selectedPoint = null;
          undoneLines = [];
        }
        drawGrid();
      }
    });

    function saveLines() {
      const filename = document.getElementById("filename").value || "untitled";
      const blob = new Blob([JSON.stringify(lines)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename + ".isk";
      a.click();
    }

    document.getElementById("fileLoader").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        try {
          lines = JSON.parse(evt.target.result);
          undoneLines = [];
          selectedPoint = null;
          drawGrid();
        } catch {
          alert("Invalid .isk file");
        }
      };
      reader.readAsText(file);
    });

    function undo() {
      if (lines.length > 0) {
        undoneLines.push(lines.pop());
        drawGrid();
      }
    }

    function redo() {
      if (undoneLines.length > 0) {
        lines.push(undoneLines.pop());
        drawGrid();
      }
    }

    drawGrid();
  </script>
</body>
</html>
